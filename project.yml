name: DictationKeyboard
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""

targets:
  DictationKeyboardApp:
    type: application
    platform: iOS
    sources:
      - DictationKeyboardApp
      - Shared
    settings:
      base:
        INFOPLIST_FILE: DictationKeyboardApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DictationKeyboard
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
    dependencies:
      - target: KeyboardExtension
        embed: true

  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - KeyboardExtension
      - Shared
    settings:
      base:
        INFOPLIST_FILE: KeyboardExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DictationKeyboard.Keyboard
        GENERATE_INFOPLIST_FILE: NO
