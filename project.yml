name: DictationKeyboard
options:
  bundleIdPrefix: com.jonesvan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "10"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""

targets:
  DictationKeyboardApp:
    type: application
    platform: iOS
    sources:
      - path: DictationKeyboardApp
        excludes:
          - PrivacyInfo.xcprivacy
      - path: DictationKeyboardApp/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: DictationKeyboardApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.jonesvan.DictationKeyboard
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
